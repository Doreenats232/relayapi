<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RelayAPI — Turn any AI website into an API</title>
<style>
:root{--bg:#0b0d12;--card:#141821;--bd:#222938;--tx:#e8ecf3;--mu:#8b95a8;--ac:#6c8cff;--ac2:#9b6cff;--ok:#3ecf8e;--er:#ff6b6b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,Segoe UI,sans-serif}
a{color:var(--ac)}button,input,select,textarea{font:inherit}
.btn{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0;padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:600}
.btn.sec{background:var(--card);border:1px solid var(--bd);color:var(--tx)}.btn.del{background:none;border:1px solid var(--bd);color:var(--er);padding:5px 10px}
input,textarea,select{width:100%;background:#0e1118;border:1px solid var(--bd);color:var(--tx);padding:10px;border-radius:8px;margin:4px 0 12px}
label{font-size:13px;color:var(--mu)}.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px;margin-bottom:16px}
code,pre{background:#0e1118;border:1px solid var(--bd);border-radius:8px;font:13px ui-monospace,Consolas,monospace}code{padding:2px 6px}pre{padding:14px;overflow:auto;position:relative}
.nav{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;border-bottom:1px solid var(--bd)}.logo{font-weight:800;font-size:18px}.logo b{color:var(--ac)}
.hero{text-align:center;padding:80px 20px 40px;max-width:760px;margin:auto}.hero h1{font-size:44px;line-height:1.1;margin:0 0 16px}.hero h1 span{background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;color:transparent}
.hero p{color:var(--mu);font-size:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;max-width:1000px;margin:30px auto;padding:0 20px}
.app{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 57px)}.side{border-right:1px solid var(--bd);padding:16px}
.side a{display:block;padding:9px 12px;border-radius:8px;color:var(--mu);text-decoration:none;cursor:pointer;margin-bottom:4px}.side a.on,.side a:hover{background:var(--card);color:var(--tx)}
.main{padding:24px;max-width:960px;width:100%}h2{margin:0 0 16px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--bd);font-size:14px}th{color:var(--mu);font-weight:500}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}.stat .n{font-size:28px;font-weight:700}.stat .l{color:var(--mu);font-size:13px}
.bars{display:flex;gap:10px;align-items:flex-end;height:120px}.bars div{flex:1;text-align:center;font-size:11px;color:var(--mu)}.bars i{display:block;background:linear-gradient(var(--ac),var(--ac2));border-radius:4px 4px 0 0;min-height:2px;margin-bottom:4px}
.ok{color:var(--ok)}.er{color:var(--er)}.mu{color:var(--mu)}.row{display:flex;gap:10px}.row>*{flex:1}.auth{max-width:380px;margin:60px auto}.chat{min-height:160px;max-height:340px;overflow:auto}
.msg{padding:10px 12px;border-radius:10px;margin-bottom:8px;white-space:pre-wrap}.msg.u{background:#1c2335}.msg.a{background:#10161f;border:1px solid var(--bd)}
.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs button{padding:5px 12px}.hide{display:none}.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 12px;z-index:9}.modal .card{max-width:860px;width:100%}
.tr{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd);font-size:13px}.tr b{min-width:150px}.shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}.shots img{width:100%;border:1px solid var(--bd);border-radius:8px}.shots small{color:var(--mu)}pre.raw{max-height:200px;white-space:pre-wrap}
@media(max-width:700px){.app{grid-template-columns:1fr}.side{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--bd)}.hero h1{font-size:32px}}
</style></head><body>
<div class="nav"><div class="logo">Relay<b>API</b></div><div id="navr"></div></div>
<div id="root"></div>
<script>
const $=s=>document.querySelector(s),root=$('#root');let tok=localStorage.tk||'',email=localStorage.em||'',tab='overview',tmp={};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=async(p,m='GET',b)=>{const r=await fetch(p,{method:m,headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok},body:b?JSON.stringify(b):undefined});const j=await r.json();if(!r.ok){if(r.status==401&&tok&&p.startsWith('/api')&&p!='/api/login'){logout();}throw new Error(j.error?.message||j.error||'Error')}return j};
const fmt=t=>t?new Date(t).toLocaleString():'—';
function logout(){localStorage.clear();tok='';render()}
function render(){ $('#navr').innerHTML=tok?`<span class="mu">${esc(email)}</span> &nbsp;<button class="btn sec" onclick="logout()">Log out</button>`:`<button class="btn sec" onclick="authView('login')">Log in</button> <button class="btn" onclick="authView('signup')">Get started</button>`;
 tok?dash():landing()}
function landing(){root.innerHTML=`<div class="hero"><h1>Turn any AI website into <span>your own API</span></h1><p>Paste a chatbot's URL. We find the text box, send your message, pull the answer back and serve it through a clean OpenAI-style endpoint.</p><br><button class="btn" onclick="authView('signup')">Create free account</button></div>
<div class="grid">${[['🔗','Add any provider','Just paste the website URL.'],['🔑','API keys','Create, name and revoke keys.'],['🧪','Playground','Test every provider in the browser.'],['📊','Usage dashboard','Requests, latency, success rate and logs.'],['🔌','OpenAI-compatible','Works with existing SDKs.'],['⚡','Rate limiting','Built-in per-key limits.']].map(x=>`<div class="card"><div style="font-size:26px">${x[0]}</div><b>${x[1]}</b><div class="mu">${x[2]}</div></div>`).join('')}</div>`}
function authView(mode){root.innerHTML=`<div class="card auth"><h2>${mode=='login'?'Welcome back':'Create account'}</h2><label>Email</label><input id="em" type="email"><label>Password</label><input id="pw" type="password" onkeydown="event.key=='Enter'&&go('${mode}')"><div id="err" class="er"></div><br><button class="btn" style="width:100%" onclick="go('${mode}')">${mode=='login'?'Log in':'Sign up'}</button></div>`}
async function go(mode){try{const r=await api('/api/'+mode,'POST',{email:$('#em').value,password:$('#pw').value});tok=localStorage.tk=r.token;email=localStorage.em=r.email;render()}catch(e){$('#err').textContent=e.message}}
function dash(){const T=[['overview','📊 Overview'],['providers','🔗 Providers'],['keys','🔑 API Keys'],['play','🧪 Playground'],['logs','📜 Logs'],['docs','📖 Docs']];
 root.innerHTML=`<div class="app"><div class="side">${T.map(t=>`<a class="${tab==t[0]?'on':''}" onclick="tab='${t[0]}';dash()">${t[1]}</a>`).join('')}</div><div class="main" id="main">Loading…</div></div>`;views[tab]()}
const views={
async overview(){const s=await api('/api/stats'),mx=Math.max(1,...s.days.map(d=>d.n));$('#main').innerHTML=`<h2>Overview</h2><div class="stats">${[['Requests',s.total],['Success rate',s.success+'%'],['Avg latency',(s.avgMs/1000).toFixed(1)+'s'],['Active keys',s.keys],['Providers',s.providers]].map(x=>`<div class="card stat"><div class="n">${x[1]}</div><div class="l">${x[0]}</div></div>`).join('')}</div><div class="card"><b>Requests, last 7 days</b><br><br><div class="bars">${s.days.map(d=>`<div><i style="height:${d.n/mx*90}px"></i>${d.n}<br>${d.d}</div>`).join('')}</div></div>${s.providers?'':'<div class="card">👉 Start by adding a provider in <b>Providers</b>.</div>'}`},
async providers(){const ps=await api('/api/providers');$('#main').innerHTML=`<h2>Providers</h2><div class="card"><b>Add an AI website</b><br><br><div class="row"><div><label>Name (used as "model")</label><input id="pn" placeholder="chatgpt"></div><div><label>Website URL</label><input id="pu" placeholder="https://chatgpt.com"></div></div>
<details><summary class="mu">Advanced selectors (optional — auto-detected if empty)</summary><br><label>Text box CSS selector</label><input id="pi" placeholder="textarea"><label>Send button selector (blank = press Enter)</label><input id="ps"><label>Reply element selector (blank = auto-detect new text)</label><input id="pr"></details><div id="perr" class="er"></div><button class="btn" onclick="addProv()">Add provider</button></div>
<div class="card"><table><tr><th>Name</th><th>URL</th><th></th></tr>${ps.map(p=>`<tr><td><code>${esc(p.name)}</code></td><td>${esc(p.url)}</td><td style="white-space:nowrap"><button class="btn sec" style="padding:5px 10px" onclick="testProv('${p.id}',this)">▶ Test</button> <button class="btn del" onclick="api('/api/providers/${p.id}','DELETE').then(views.providers)">Delete</button></td></tr>`).join('')||'<tr><td colspan=3 class="mu">None yet</td></tr>'}</table></div>`},
async keys(){const ks=(await api('/api/keys')).filter(k=>!k.revoked);$('#main').innerHTML=`<h2>API Keys</h2>${tmp.key?`<div class="card"><b class="ok">Key created — copy it now, it won't be shown again</b><pre>${tmp.key}</pre></div>`:''}<div class="card row"><input id="kn" placeholder="Key name (e.g. my-app)" style="margin:0"><button class="btn" style="flex:0 0 140px" onclick="newKey()">Create key</button></div>
<div class="card"><table><tr><th>Name</th><th>Key</th><th>Created</th><th>Last used</th><th>Reqs</th><th></th></tr>${ks.map(k=>`<tr><td>${esc(k.name)}</td><td><code>${k.prefix}</code></td><td>${fmt(k.created)}</td><td>${fmt(k.lastUsed)}</td><td>${k.requests}</td><td><button class="btn del" onclick="api('/api/keys/${k.id}','DELETE').then(views.keys)">Revoke</button></td></tr>`).join('')||'<tr><td colspan=6 class="mu">No keys</td></tr>'}</table></div>`;tmp.key=''},
async play(){const ps=await api('/api/providers');$('#main').innerHTML=`<h2>Playground</h2><div class="card"><label>Provider</label><select id="pm">${ps.map(p=>`<option>${esc(p.name)}</option>`).join('')}</select><div class="chat" id="chat"><span class="mu">Replies take 10–60s (a real browser is typing for you).</span></div><textarea id="pt" rows="3" placeholder="Say something…"></textarea><label><input type="checkbox" id="pd" style="width:auto;margin:0 6px 0 0">Debug mode (show trace + screenshots)</label><br><br><button class="btn" id="pb" onclick="sendPlay()">Send</button></div>`},
async logs(){const l=await api('/api/logs');$('#main').innerHTML=`<h2>Logs</h2><div class="card"><table><tr><th>Time</th><th>Provider</th><th>Status</th><th>Latency</th><th>Prompt chars</th></tr>${l.map(x=>`<tr><td>${fmt(x.ts)}</td><td><code>${esc(x.provider)}</code></td><td class="${x.ok?'ok':'er'}" title="${esc(x.err)}">${x.ok?'OK':'Failed'}</td><td>${(x.ms/1000).toFixed(1)}s</td><td>${x.promptLen}</td></tr>`).join('')||'<tr><td colspan=5 class="mu">No requests yet</td></tr>'}</table></div>`},
async docs(){const u=location.origin;const ex={curl:`curl ${u}/v1/chat/completions \\\n  -H "Authorization: Bearer YOUR_KEY" \\\n  -H "Content-Type: application/json" \\\n  -d '{"model":"chatgpt","messages":[{"role":"user","content":"Hello!"}]}'`,
js:`const r = await fetch("${u}/v1/chat/completions", {\n  method: "POST",\n  headers: { "Authorization": "Bearer YOUR_KEY", "Content-Type": "application/json" },\n  body: JSON.stringify({ model: "chatgpt", messages: [{ role: "user", content: "Hello!" }] })\n});\nconsole.log((await r.json()).choices[0].message.content);`,
python:`import requests\nr = requests.post("${u}/v1/chat/completions",\n  headers={"Authorization": "Bearer YOUR_KEY"},\n  json={"model": "chatgpt", "messages": [{"role": "user", "content": "Hello!"}]})\nprint(r.json()["choices"][0]["message"]["content"])`};tmp.ex=ex;
$('#main').innerHTML=`<h2>Docs</h2><div class="card"><b>Base URL</b><pre>${u}/v1</pre><b>Auth</b><p class="mu">Send <code>Authorization: Bearer YOUR_KEY</code>. <code>model</code> = the provider name you added.</p></div><div class="card"><b>POST /v1/chat/completions</b><div class="tabs">${Object.keys(ex).map(k=>`<button class="btn sec" onclick="showEx('${k}')">${k}</button>`).join('')}</div><pre id="ex">${esc(ex.curl)}</pre></div><div class="card"><b>GET /v1/models</b><p class="mu">Lists your providers.</p><b>Errors</b><p class="mu">401 bad key · 404 unknown provider · 429 over 20 req/min · 502 website failed or timed out.</p><p class="mu">OpenAI SDKs work: set <code>base_url</code> to <code>${u}/v1</code>.</p></div>`}};
const showEx=k=>$('#ex').textContent=tmp.ex[k];
async function addProv(){try{await api('/api/providers','POST',{name:$('#pn').value,url:$('#pu').value,inputSel:$('#pi').value,sendSel:$('#ps').value,responseSel:$('#pr').value});views.providers()}catch(e){$('#perr').textContent=e.message}}
async function newKey(){const r=await api('/api/keys','POST',{name:$('#kn').value});tmp.key=r.key;views.keys()}
async function sendPlay(){const t=$('#pt').value.trim(),m=$('#pm').value;if(!t||!m)return;const c=$('#chat'),b=$('#pb');c.innerHTML+=`<div class="msg u">${esc(t)}</div>`;$('#pt').value='';b.disabled=true;b.textContent='Waiting…';
 try{const dbg=$('#pd').checked;const r=await api('/api/playground','POST',{model:m,debug:dbg,messages:[{role:'user',content:t}]});if(dbg){showDebug(r);c.innerHTML+=`<div class="msg ${r.ok?'a':'er'}">${esc(r.ok?r.text:r.error)}</div>`}else c.innerHTML+=`<div class="msg a">${esc(r.choices[0].message.content)}</div>`}catch(e){c.innerHTML+=`<div class="msg er">${esc(e.message)}</div>`}b.disabled=false;b.textContent='Send';c.scrollTop=1e9}
async function testProv(id,btn){btn.disabled=true;btn.textContent='Testing… (up to 90s)';try{showDebug(await api('/api/providers/'+id+'/test','POST'),true)}catch(e){alert(e.message)}btn.disabled=false;btn.textContent='▶ Test'}
function showDebug(r,isTest){const m=document.createElement('div');m.className='modal';m.onclick=e=>{if(e.target==m)m.remove()};
m.innerHTML=`<div class="card"><div class="row" style="align-items:center"><h2 style="margin:0">${isTest?(r.pass?'<span class="ok">✔ Test passed</span>':'<span class="er">✘ Test failed</span>'):(r.ok?'<span class="ok">✔ Completed</span>':'<span class="er">✘ Failed</span>')}</h2><button class="btn sec" style="flex:0 0 80px" onclick="this.closest('.modal').remove()">Close</button></div><br>
<b>Trace</b>${r.trace.map(t=>`<div class="tr"><b class="${t.ok?'ok':'er'}">${t.ok?'✔':'✘'} ${esc(t.step)}</b><span class="mu">${(t.t/1000).toFixed(1)}s</span><span>${esc(t.detail)}</span></div>`).join('')}<br>
${r.selector?`<p><b>Matched text box:</b> <code>${esc(r.selector)}</code></p>`:''}${r.ok?`<p><b>Cleaned reply (what your API returns):</b></p><pre class="raw">${esc(r.text)}</pre>`:''}${r.raw?`<details><summary class="mu">Raw scraped page text (end)</summary><pre class="raw">${esc(r.raw)}</pre></details><br>`:''}
<b>Screenshots</b><div class="shots">${r.shots.map(s=>`<div><img src="data:image/jpeg;base64,${s.img}"><small>${esc(s.label)}</small></div>`).join('')||'<span class="mu">None captured</span>'}</div></div>`;document.body.appendChild(m)}
render();
</script></body></html>
