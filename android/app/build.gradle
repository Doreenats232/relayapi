plugins { id 'com.android.application' }

android {
    namespace 'app.relay.assistant'
    compileSdk 34
    defaultConfig {
        applicationId 'app.relay.assistant'
        minSdk 26
        targetSdk 34
        versionCode (System.getenv('APP_VERSION_CODE') ?: '1').toInteger()
        versionName '1.0'
    }
    signingConfigs {
        release {
            def ks = System.getenv('KEYSTORE_PATH')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias 'relay'
                keyPassword System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('KEYSTORE_PATH') ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false }
}
