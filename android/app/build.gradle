plugins { id 'com.android.application' }

def ksPath = System.getenv('KEYSTORE_PATH')
def ksPw = System.getenv('KEYSTORE_PASSWORD')
def hasKey = (ksPath != null && ksPw != null)
def vCode = (System.getenv('APP_VERSION_CODE') ?: '1') as Integer

android {
    namespace 'app.relay.assistant'
    compileSdk 34
    defaultConfig {
        applicationId 'app.relay.assistant'
        minSdk 26
        targetSdk 34
        versionCode vCode
        versionName '1.0'
    }
    signingConfigs {
        release {
            if (hasKey) {
                storeFile file(ksPath)
                storePassword ksPw
                keyAlias 'relay'
                keyPassword ksPw
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (hasKey) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false }
}
