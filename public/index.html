<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RelayAPI — Turn any AI website into an API</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080d;--s1:#0d0f16;--s2:#12151e;--s3:#181c28;--bd:#1f2433;--bd2:#2a3045;--tx:#eef1f8;--mu:#8791a7;--mu2:#5b647a;--a1:#6366f1;--a2:#8b5cf6;--a3:#22d3ee;--ok:#34d399;--er:#fb7185;--wa:#fbbf24;--g:linear-gradient(135deg,#6366f1,#8b5cf6 55%,#22d3ee);--r:14px}
*{box-sizing:border-box;margin:0}html,body{height:100%}body{background:var(--bg);color:var(--tx);font:14px/1.55 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
::selection{background:#6366f155}::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:8px}
button,input,select,textarea{font:inherit;color:inherit}a{color:var(--a3);text-decoration:none}
.mono,code,pre{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace}code{font-size:12px;background:var(--s3);border:1px solid var(--bd);padding:2px 7px;border-radius:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;font-weight:600;padding:10px 16px;border-radius:10px;background:var(--g);color:#fff;transition:.2s;box-shadow:0 6px 24px -8px #6366f1aa}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 30px -8px #8b5cf6cc}.btn:disabled{opacity:.6;cursor:wait;transform:none}
.btn.sec{background:var(--s2);border:1px solid var(--bd2);box-shadow:none;color:var(--tx)}.btn.sec:hover{background:var(--s3)}
.btn.ghost{background:none;box-shadow:none;color:var(--mu);padding:8px 10px}.btn.ghost:hover{color:var(--tx);background:var(--s2)}.btn.dng{background:none;box-shadow:none;color:var(--er);border:1px solid #fb718533;padding:8px 10px}.btn.dng:hover{background:#fb71851a}.btn.sm{padding:7px 11px;font-size:13px}
.fld{position:relative;margin-bottom:14px}.fld label{display:block;font-size:12px;font-weight:500;color:var(--mu);margin-bottom:6px}
.fld input,.fld select,.fld textarea{width:100%;background:var(--s1);border:1px solid var(--bd2);border-radius:10px;padding:11px 13px;outline:0;transition:.15s}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--a1);box-shadow:0 0 0 3px #6366f126}.fld small{color:var(--mu2);font-size:12px}
.card{background:linear-gradient(180deg,#ffffff06,#ffffff02),var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:20px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;border:1px solid}.pill:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok);background:#34d3991a;border-color:#34d39933}.pill.er{color:var(--er);background:#fb71851a;border-color:#fb718533}.pill.wa{color:var(--mu);background:var(--s2);border-color:var(--bd2)}
.ok{color:var(--ok)}.er{color:var(--er)}.mu{color:var(--mu)}
/* auth */
.auth{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh}
.brand{position:relative;overflow:hidden;padding:48px 56px;display:flex;flex-direction:column;justify-content:space-between;background:#090b14;border-right:1px solid var(--bd)}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.55;animation:fl 14s ease-in-out infinite}.o1{width:420px;height:420px;background:#6366f1;top:-120px;left:-100px}.o2{width:360px;height:360px;background:#22d3ee;bottom:-120px;right:-60px;animation-delay:-5s;opacity:.3}.o3{width:300px;height:300px;background:#8b5cf6;top:40%;left:40%;animation-delay:-9s;opacity:.35}
@keyframes fl{50%{transform:translate(40px,-30px) scale(1.1)}}
.brand>*{position:relative;z-index:1}.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.3px}.logo i{width:32px;height:32px;border-radius:9px;background:var(--g);display:grid;place-items:center;box-shadow:0 6px 20px -6px #8b5cf6}
.brand h1{font-size:42px;line-height:1.08;letter-spacing:-1.4px;font-weight:800;margin-bottom:16px}.brand h1 span,.grad{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand p{color:var(--mu);font-size:16px;max-width:460px}.feat{display:grid;gap:10px;margin-top:26px}.feat div{display:flex;gap:10px;align-items:center;color:#c5cce0}.feat svg{color:var(--a3)}
.snip{margin-top:30px;background:#05060ab3;backdrop-filter:blur(10px);border:1px solid var(--bd2);border-radius:12px;padding:16px;font-size:12px;color:#aeb7d0;max-width:470px}.snip b{color:var(--a3);font-weight:500}.snip em{color:#c4b5fd;font-style:normal}
.formside{display:grid;place-items:center;padding:30px}.box{width:100%;max-width:380px;animation:up .5s}.box h2{font-size:26px;letter-spacing:-.6px;font-weight:700}.box>p{color:var(--mu);margin:6px 0 24px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--s1);border:1px solid var(--bd);border-radius:11px;padding:4px;margin-bottom:22px}.seg button{border:0;background:none;padding:8px;border-radius:8px;cursor:pointer;color:var(--mu);font-weight:600}.seg button.on{background:var(--s3);color:var(--tx);box-shadow:0 2px 8px #0006}
.eye{position:absolute;right:6px;bottom:5px;background:none;border:0;color:var(--mu);cursor:pointer;padding:7px}.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}@keyframes up{from{opacity:0;transform:translateY(10px)}}
/* shell */
.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--s1);border-right:1px solid var(--bd);padding:18px 14px;display:flex;flex-direction:column;gap:4px}.side .logo{padding:6px 10px 18px}
.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--mu);cursor:pointer;font-weight:500;transition:.15s;position:relative}.nav:hover{background:var(--s2);color:var(--tx)}
.nav.on{background:linear-gradient(90deg,#6366f126,#6366f108);color:#fff}.nav.on:before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--g)}.nav.on svg{color:var(--a3)}
.sp{flex:1}.me{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--bd);border-radius:12px;background:var(--s2)}.av{width:34px;height:34px;border-radius:10px;background:var(--g);display:grid;place-items:center;font-weight:700;flex:0 0 auto}.me div{min-width:0;flex:1}.me small{display:block;color:var(--mu2);font-size:11px}.me b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 32px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:#07080dd9;backdrop-filter:blur(14px);z-index:5}.top h1{font-size:20px;letter-spacing:-.4px}.top small{color:var(--mu)}.burger{display:none}
.banner{background:#fbbf2417;border-bottom:1px solid #fbbf2455;color:#fcd34d;padding:10px 32px;font-size:13px}.main{padding:28px 32px 60px;max-width:1120px;animation:up .35s}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:16px}.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;margin-bottom:16px}
.stat{display:flex;flex-direction:column;gap:12px}.stat .ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:#6366f11f;color:#a5b4fc}.stat .n{font-size:30px;font-weight:800;letter-spacing:-1px}.stat .l{color:var(--mu);font-size:13px;margin-top:-8px}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap}.hd h3{font-size:15px;font-weight:600}
table{width:100%;border-collapse:collapse}th{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--mu2);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--bd)}td{padding:12px 10px;border-bottom:1px solid var(--bd);font-size:13px}tr:last-child td{border:0}tbody tr:hover{background:#ffffff04}
.tw{overflow-x:auto}.chk{display:grid;gap:10px}.chk div{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;cursor:pointer}.chk i{width:22px;height:22px;border-radius:50%;border:2px solid var(--bd2);display:grid;place-items:center;flex:0 0 auto}.chk .done i{background:var(--ok);border-color:var(--ok);color:#06281c}.chk .done span{color:var(--mu);text-decoration:line-through}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}.prov{display:flex;flex-direction:column;gap:14px;transition:.2s}.prov:hover{border-color:var(--bd2);transform:translateY(-2px)}
.prov .t{display:flex;gap:12px;align-items:center}.fav{width:42px;height:42px;border-radius:12px;background:var(--s3);border:1px solid var(--bd);display:grid;place-items:center;overflow:hidden;flex:0 0 auto}.fav img{width:24px;height:24px}.prov .u{color:var(--mu2);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.empty{text-align:center;padding:50px 20px;color:var(--mu)}.empty .ico{width:56px;height:56px;border-radius:16px;margin:0 auto 14px;display:grid;place-items:center;background:#6366f11f;color:#a5b4fc}.empty h4{color:var(--tx);font-size:16px;margin-bottom:4px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.chip{border:1px solid var(--bd2);background:var(--s2);border-radius:99px;padding:5px 12px;font-size:12px;cursor:pointer;color:var(--mu)}.chip:hover{color:var(--tx);border-color:var(--a1)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* playground */
.pg{display:grid;grid-template-rows:auto 1fr auto;height:calc(100vh - 190px);min-height:420px;padding:0;overflow:hidden}.pgh{display:flex;gap:12px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--bd)}.pgh select{background:var(--s2);border:1px solid var(--bd2);border-radius:9px;padding:7px 10px}
.chat{overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}.msg{max-width:78%;padding:11px 14px;border-radius:14px;white-space:pre-wrap;word-break:break-word;animation:up .25s}.msg.u{align-self:flex-end;background:var(--g);color:#fff;border-bottom-right-radius:4px}.msg.a{background:var(--s3);border:1px solid var(--bd);border-bottom-left-radius:4px}.msg.e{background:#fb71851a;border:1px solid #fb718533;color:var(--er)}
.dots span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--mu);margin:0 2px;animation:bn 1s infinite}.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}@keyframes bn{50%{transform:translateY(-5px);background:var(--a3)}}
.pgf{display:flex;gap:10px;padding:14px 18px;border-top:1px solid var(--bd);align-items:flex-end}.pgf textarea{flex:1;background:var(--s2);border:1px solid var(--bd2);border-radius:11px;padding:11px 13px;resize:none;outline:0}.pgf textarea:focus{border-color:var(--a1)}
.tog{display:flex;align-items:center;gap:8px;color:var(--mu);font-size:12px;cursor:pointer;margin-left:auto}.tog input{accent-color:var(--a1)}
/* code */
.code{position:relative}.code pre{background:#05060a;border:1px solid var(--bd);border-radius:12px;padding:16px;overflow:auto;font-size:12.5px;line-height:1.7;color:#c9d1e6}.code .cp{position:absolute;top:10px;right:10px}
.tabs{display:flex;gap:4px;margin-bottom:10px}.tabs button{background:none;border:0;color:var(--mu);padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:600}.tabs button.on{background:var(--s3);color:var(--tx)}
.ep{display:flex;gap:10px;align-items:center;margin-bottom:10px}.mth{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;background:#34d3991a;color:var(--ok)}.mth.g{background:#22d3ee1a;color:var(--a3)}
/* modal/toast */
.modal{position:fixed;inset:0;background:#000b;backdrop-filter:blur(6px);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:5vh 14px;z-index:50;animation:fi .2s}@keyframes fi{from{opacity:0}}
.modal>.card{width:100%;max-width:520px;background:var(--s1);box-shadow:0 30px 80px #000a;animation:up .25s}.modal.wide>.card{max-width:880px}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.mh h3{font-size:17px}
.toasts{position:fixed;bottom:20px;right:20px;display:grid;gap:8px;z-index:99}.toast{background:var(--s3);border:1px solid var(--bd2);padding:11px 16px;border-radius:11px;box-shadow:0 10px 30px #0008;animation:up .25s;display:flex;gap:8px;align-items:center}.toast.ok svg{color:var(--ok)}.toast.er svg{color:var(--er)}
.tr{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd);font-size:13px;align-items:baseline}.tr b{min-width:160px;font-weight:600}.tr .t{color:var(--mu2);min-width:40px}
.shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:8px}.shots img{width:100%;border:1px solid var(--bd2);border-radius:10px}.shots small{color:var(--mu)}
pre.raw{max-height:180px;overflow:auto;white-space:pre-wrap;background:#05060a;border:1px solid var(--bd);border-radius:10px;padding:12px;font-size:12px;margin:6px 0}
.lv{position:relative;border:1px solid var(--bd2);border-radius:12px;overflow:hidden;background:#000;outline:0;cursor:pointer;min-height:200px}.lv:focus{border-color:var(--a1);box-shadow:0 0 0 3px #6366f126}.lv canvas{width:100%;display:block;touch-action:none;outline:0;aspect-ratio:1280/800;background:#fff}.modal.xl>.card{max-width:1180px}.lvbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}.lvbar input{flex:1;min-width:160px;background:var(--s2);border:1px solid var(--bd2);border-radius:9px;padding:8px 11px;outline:0}
.sk{height:90px;border-radius:14px;background:linear-gradient(90deg,var(--s1),var(--s3),var(--s1));background-size:200% 100%;animation:sm 1.2s infinite}@keyframes sm{to{background-position:-200% 0}}
.keybox{display:flex;gap:8px;align-items:center;background:#05060a;border:1px dashed #34d39966;border-radius:11px;padding:12px;margin:12px 0;word-break:break-all;font-size:13px;color:var(--ok)}
@media(max-width:860px){.auth{grid-template-columns:1fr}.brand{display:none}.shell{grid-template-columns:1fr}.side{position:fixed;z-index:30;transform:translateX(-100%);transition:.25s;width:260px}.side.open{transform:none}.burger{display:inline-flex}.main{padding:20px 16px 60px}.top{padding:14px 16px}.grid2,.row{grid-template-columns:1fr}}
</style></head><body><div id="root"></div><div class="toasts" id="toasts"></div>
<script>
const $=s=>document.querySelector(s),root=$('#root'),sleep=ms=>new Promise(r=>setTimeout(r,ms));
let tok=localStorage.tk||'',email=localStorage.em||'',tmp={chat:[],ex:'curl'},mode='login';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P={home:'<path d="M3 11l9-8 9 8v10a1 1 0 01-1 1h-5v-7H9v7H4a1 1 0 01-1-1z"/>',globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/>',key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/>',flask:'<path d="M9 3h6M10 3v6L4 19a2 2 0 002 3h12a2 2 0 002-3l-6-10V3"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',book:'<path d="M4 19V5a2 2 0 012-2h14v16H6a2 2 0 00-2 2zM4 19a2 2 0 002 2h14"/>',copy:'<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/>',check:'<path d="M20 6L9 17l-5-5"/>',trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 15h10l1-15"/>',play:'<path d="M6 4l14 8-14 8z"/>',plus:'<path d="M12 5v14M5 12h14"/>',x:'<path d="M18 6L6 18M6 6l12 12"/>',out:'<path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/>',bolt:'<path d="M13 2L3 14h9l-1 8 10-12h-9z"/>',act:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',send:'<path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/>',menu:'<path d="M3 6h18M3 12h18M3 18h18"/>',eye:'<path d="M2 12s4-8 10-8 10 8 10 8-4 8-10 8S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'};
const ic=(n,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;
const LOGO=`<div class="logo"><i>${ic('bolt',17)}</i>Relay<span class="grad">API</span></div>`;
const fmt=t=>t?new Date(t).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
const ago=t=>{if(!t)return 'Never';const s=(Date.now()-t)/1e3;return s<60?'just now':s<3600?Math.floor(s/60)+'m ago':s<86400?Math.floor(s/3600)+'h ago':Math.floor(s/86400)+'d ago'};
function toast(m,t='ok'){const e=document.createElement('div');e.className='toast '+t;e.innerHTML=ic(t=='ok'?'check':'x',16)+esc(m);$('#toasts').appendChild(e);setTimeout(()=>e.remove(),3200)}
function copy(t){navigator.clipboard.writeText(t).then(()=>toast('Copied to clipboard'))}
function modal(html,wide){const m=document.createElement('div');m.className='modal'+(wide?' wide':'');m.onmousedown=e=>{if(e.target==m)m.remove()};m.innerHTML=`<div class="card">${html}</div>`;document.body.appendChild(m);return m}
const closeM=()=>document.querySelectorAll('.modal').forEach(m=>m.remove());
const api=async(p,m='GET',b)=>{const r=await fetch(p,{method:m,headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok},body:b?JSON.stringify(b):undefined});const j=await r.json();if(!r.ok){if(r.status==401&&p.startsWith('/api')&&!/login|signup|google/.test(p))logout();throw new Error(j.error?.message||j.error||'Error')}return j};
function logout(){localStorage.clear();tok='';location.hash='';render()}
const page=()=>(location.hash.replace('#/','')||'overview');
window.onhashchange=()=>tok&&shell();
let cfg=null,mailOpen=false,gInit=false;
async function loadCfg(){if(cfg)return;cfg=await fetch('/api/config').then(r=>r.json()).catch(()=>({}));
 if(cfg.googleClientId)await new Promise(r=>{const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.onload=s.onerror=r;document.head.appendChild(s)})}
function render(){loadCfg().then(()=>tok?shell():authView())}
async function onGoogle(r){try{const j=await api('/api/google','POST',{credential:r.credential});tok=localStorage.tk=j.token;email=localStorage.em=j.email;localStorage.pic=j.picture||'';location.hash='#/overview';render()}catch(e){toast(e.message,'er')}}
function initGoogle(){if(!window.google||!google.accounts){return setTimeout(initGoogle,300)}
 if(!gInit){google.accounts.id.initialize({client_id:cfg.googleClientId,callback:onGoogle});gInit=true}
 const b=$('#gbtn');if(b)google.accounts.id.renderButton(b,{theme:'filled_black',size:'large',text:'continue_with',shape:'pill',width:340})}
/* ---------- AUTH ---------- */
function authView(){root.innerHTML=`<div class="auth"><div class="brand"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>${LOGO}
<div><h1>Turn any AI website into <span>your own API</span></h1><p>Paste a chatbot URL. We find the text box, send your message, pull the answer back and serve it through a clean OpenAI-style endpoint.</p>
<div class="feat"><div>${ic('globe')}Add any provider by URL</div><div>${ic('shield')}Scoped, revocable API keys</div><div>${ic('act')}Live debug traces &amp; screenshots</div></div>
<div class="snip mono"><b>POST</b> /v1/chat/completions<br>{ <em>"model"</em>: "chatgpt",<br>&nbsp;&nbsp;<em>"messages"</em>: [{ "role": "user", "content": "Hi!" }] }</div></div>
<div class="mu" style="font-size:12px">© RelayAPI</div></div>
<div class="formside"><div class="box" id="ab"></div></div></div>`;authForm()}
function authForm(){const l=mode=='login',g=!!(cfg&&cfg.googleClientId),em=!g||mailOpen;
$('#ab').innerHTML=`<h2>${g?'Sign in to RelayAPI':l?'Welcome back':'Create your account'}</h2><p>${g?'Continue with Google — no password to remember.':l?'Log in to manage your providers and keys.':'Free to start. Build your first API in a minute.'}</p>
${g?`<div id="gbtn" style="display:flex;justify-content:center;min-height:44px;margin-bottom:14px"></div><div style="text-align:center;font-size:12px;margin-bottom:16px"><a href="#" onclick="mailOpen=!mailOpen;authForm();return false">${mailOpen?'Hide email sign-in':'Use email &amp; password instead'}</a></div>`:''}

function chart(days){const W=600,H=170,mx=Math.max(3,...days.map(d=>d.n)),x=i=>20+i*(W-40)/(days.length-1),y=v=>H-24-(v/mx)*(H-50);

<path d="${d} L${pts[pts.length-1][0]},${H-24} L${pts[0][0]},${H-24}Z" fill="url(#g1)"/><path d="${d}" fill="none" stroke="url(#g2)" stroke-width="2.5" stroke-linecap="round"/>

saveChat(m,chat);if($('#pb')&&tmp.pm==m)V.playground()}
function showDebug(r,isTest,pid){const hd=isTest?(r.pass?'<span class="ok">✔ Test passed</span>':'<span class="er">✘ Test failed</span>'):(r.ok?'<span class="ok">✔ Completed</span>':'<span class="er">✘ Failed</span>');
modal(`<div class="mh"><h3>${hd}</h3><button class="btn ghost" onclick="closeM()">${ic('x')}</button></div><b>Trace</b>${r.trace.map(t=>`<div class="tr"><b class="${t.ok?'ok':'er'}">${t.ok?'✔':'✘'} ${esc(t.step)}</b><span class="t">${(t.t/1000).toFixed(1)}s</span><span class="mu">${esc(t.detail)}</span></div>`).join('')}
${r.selector?`<p style="margin-top:14px"><b>Matched text box:</b> <code>${esc(r.selector)}</code></p>`:''}${r.ok?`<p style="margin-top:14px"><b>Cleaned reply (what your API returns)</b></p><pre class="raw">${esc(r.text)}</pre>`:''}${r.raw?`<details style="margin-top:8px"><summary class="mu" style="cursor:pointer">Raw scraped page text</summary><pre class="raw">${esc(r.raw)}</pre></details>`:''}
${pid&&!r.ok?`<div class="card" style="margin-top:14px;background:var(--s2)"><b>Blocked by a human check or login?</b><p class="mu" style="margin:4px 0 10px">Open the built-in browser, log in or pass the check yourself, then save the session.</p><button class="btn" onclick="closeM();liveView('${pid}')">${ic('globe',16)}Log in with the built-in browser</button></div>`:''}<p style="margin:14px 0 4px"><b>Screenshots</b></p><div class="shots">${r.shots.map(s=>`<div><img src="data:image/jpeg;base64,${s.img}"><small>${esc(s.label)}</small></div>`).join('')||'<span class="mu">None captured</span>'}</div>`,true)}
const W=1024,H=640;
async function liveView(pid){let sid,saved=false,ws,gotFrame=false;toast('Starting live browser…');try{sid=(await api('/api/providers/'+pid+'/live','POST')).sid}catch(e){return toast(e.message,'er')}
const m=modal(`<div class="mh"><h3>Live browser</h3><button class="btn ghost" onclick="closeM()">${ic('x')}</button></div>
<div class="lvbar" style="margin:0 0 10px"><button class="btn sec sm" onclick="lvSend2({t:'back'})">←</button><button class="btn sec sm" onclick="lvSend2({t:'reload'})">⟳</button><input id="lvu" placeholder="Address" onkeydown="event.key=='Enter'&&lvSend2({t:'nav',url:this.value})"><select id="lvq" onchange="lvSend2({t:'quality',q:this.value})" style="background:var(--s2);border:1px solid var(--bd2);border-radius:9px;padding:7px 10px"><option value="low">Smooth</option><option value="high">Sharp</option></select></div>
<div class="lv" id="lv"><canvas id="lvc" width="${W}" height="${H}" tabindex="0"></canvas><div id="lvl" class="empty" style="position:absolute;inset:0;display:grid;place-content:center;background:#000;color:var(--mu)">Connecting to browser…</div></div>
<div class="lvbar"><input id="lvt" placeholder="Type or paste text (for phones), then Send" onkeydown="event.key=='Enter'&&lvTxt()"><button class="btn sec sm" onclick="lvTxt()">Send</button><button class="btn sec sm" onclick="lvSend2({t:'key',key:'Enter'})">Enter</button><button class="btn sec sm" onclick="lvSend2({t:'key',key:'Tab'})">Tab</button><button class="btn sec sm" onclick="lvSend2({t:'key',key:'Backspace'})">⌫</button><button class="btn sec sm" onclick="lvSend2({t:'wheel',dy:-400,x:512,y:320})">↑ Scroll</button><button class="btn sec sm" onclick="lvSend2({t:'wheel',dy:400,x:512,y:320})">↓ Scroll</button></div>
<p class="mu" style="margin-top:10px;font-size:12px">Log in or pass the check until you see the normal chat page, then press Save session. Tip: use email + password — “Continue with Google” is often blocked inside automated browsers.</p>
<div style="display:flex;gap:10px;margin-top:10px"><button class="btn" style="flex:1" onclick="lvSave()">${ic('check',16)}Save session</button><button class="btn sec" onclick="closeM()">Cancel</button></div>`,true);m.classList.add('xl');
const cv=$('#lvc'),cx=cv.getContext('2d',{alpha:false,desynchronized:true}),send=o=>ws&&ws.readyState==1&&ws.send(JSON.stringify(o));window.lvSend2=send;window.lvTxt=()=>{const v=$('#lvt').value;if(v){send({t:'text',text:v});$('#lvt').value=''}};
window.lvSave=async()=>{try{const r=await api('/api/live/'+sid+'/save','POST',{pid});saved=true;closeM();const lw=/login|signin|sign-in|auth/i.test(r.url||'');toast(lw?'Saved, but the page is still on a login screen, so you are probably not logged in yet. Finish logging in, then save again.':'Session saved ('+(r.info||r.cookies+' cookies')+') — run a test',lw?'er':'ok');V.providers()}catch(e){toast(e.message,'er')}};
const pos=e=>{const r=cv.getBoundingClientRect();return{x:Math.round((e.clientX-r.left)/r.width*W),y:Math.round((e.clientY-r.top)/r.height*H)}};let lastMv=0;
let tp=null;cv.onpointermove=e=>{const n=performance.now();if(n-lastMv<16)return;lastMv=n;if(tp&&e.pointerType=='touch'){const r=cv.getBoundingClientRect(),k=W/r.width;if(Math.abs(e.clientX-tp.sx)+Math.abs(e.clientY-tp.sy)>8)tp.moved=true;if(tp.moved){send({t:'wheel',dx:(tp.x-e.clientX)*k,dy:(tp.y-e.clientY)*k,...pos(e)});tp.x=e.clientX;tp.y=e.clientY}return}send({t:'move',...pos(e)})};
cv.onpointerdown=e=>{e.preventDefault();cv.focus();cv.setPointerCapture(e.pointerId);if(e.pointerType=='touch'){tp={x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,moved:false,p:pos(e)};return}send({t:'down',b:e.button,...pos(e)})};
cv.onpointerup=e=>{e.preventDefault();if(tp&&e.pointerType=='touch'){const t=tp;tp=null;if(!t.moved){send({t:'down',b:0,...t.p});send({t:'up',b:0,...t.p})}return}send({t:'up',b:e.button,...pos(e)})};cv.onpointercancel=()=>{tp=null};cv.oncontextmenu=e=>e.preventDefault();
cv.onwheel=e=>{e.preventDefault();const k=e.deltaMode==1?40:e.deltaMode==2?600:1;send({t:'wheel',dx:e.deltaX*k,dy:e.deltaY*k,...pos(e)})};
const SP=['Enter','Backspace','Tab','Escape','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Delete','Home','End','PageUp','PageDown'];
cv.onkeydown=e=>{if(e.ctrlKey||e.metaKey)return;if(e.key.length==1){e.preventDefault();send({t:'text',text:e.key})}else if(SP.includes(e.key)){e.preventDefault();send({t:'key',key:e.key})}};
const onPaste=e=>{if(!document.body.contains(m)){document.removeEventListener('paste',onPaste);return}const t=e.clipboardData.getData('text');if(t&&document.activeElement!=$('#lvt')&&document.activeElement!=$('#lvu')){e.preventDefault();send({t:'text',text:t})}};document.addEventListener('paste',onPaste);
function connect(){ws=new WebSocket((location.protocol=='https:'?'wss://':'ws://')+location.host+'/live?sid='+sid+'&t='+tok);
ws.onopen=()=>send({t:'quality',q:$('#lvq').value});let latest=null,busy=false;
const draw=async()=>{busy=true;while(latest){const b=latest;latest=null;try{const bmp=await createImageBitmap(b);cx.drawImage(bmp,0,0,W,H);bmp.close();if(!gotFrame){gotFrame=true;$('#lvl').remove()}}catch{}}busy=false};
ws.onmessage=ev=>{if(typeof ev.data=='string'){const d=JSON.parse(ev.data);if(d.t=='url'&&document.activeElement!=$('#lvu'))$('#lvu').value=d.url;return}latest=ev.data;if(!busy)draw()};
ws.onclose=()=>{if(document.body.contains(m)&&!saved)setTimeout(()=>document.body.contains(m)&&connect(),1000)}}
connect();
const chk=setInterval(()=>{if(!document.body.contains(m)){clearInterval(chk);ws&&ws.close();if(!saved)api('/api/live/'+sid,'DELETE').catch(()=>{})}},800)}
render();
</script></body></html>
