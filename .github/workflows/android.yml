name: Build Android app
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/relay.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/relay.keystore" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          APP_VERSION_CODE: ${{ github.run_number }}
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --console=plain :app:assembleRelease 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          MSG=$(sed -n '/What went wrong/,/\* Try/p' "$RUNNER_TEMP/build.log" | head -20 | cut -c1-230 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          echo "::error title=Gradle::$MSG"
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk RelayApp.apk
          gh release delete app-latest --cleanup-tag --yes || true
          gh release create app-latest RelayApp.apk --title "Relay app (latest)" --notes "Install RelayApp.apk on your phone. The app loads its screens from your relay, so most updates need no reinstall." --latest=false
