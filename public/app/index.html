<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0d14">
<title>Relay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0c0d14;--s1:#14162299;--s2:#171a2b;--s3:#1e2238;--ln:#262a43;--tx:#eceefb;--mu:#8a90b2;--a1:#8b7bff;--a2:#36d6ff;--ok:#4ade80;--bad:#ff6b81;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);color:var(--tx);font:15px/1.5 Outfit,system-ui,-apple-system,Roboto,sans-serif;overscroll-behavior:none}
body{background:radial-gradient(900px 420px at 85% -10%,#2a2170aa,transparent 60%),radial-gradient(700px 380px at -10% 110%,#0b4f6a77,transparent 60%),var(--ink)}
#app{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.orb{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--a1),var(--a2));display:grid;place-items:center;box-shadow:0 0 28px #8b7bff66;flex:none}
.orb svg{width:60%;height:60%}
.top{display:flex;align-items:center;gap:12px;padding:14px 18px}
.top h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.01em}
.top .sp{flex:1}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--s2);border:1px solid var(--ln)}
.ib svg{width:20px;height:20px;stroke:var(--tx);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.scroll{flex:1;overflow-y:auto;padding:4px 18px 24px}
.card{background:var(--s2);border:1px solid var(--ln);border-radius:var(--r);padding:14px 16px}
.prov{display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin-bottom:10px}
.prov:active{background:var(--s3)}
.av{width:46px;height:46px;border-radius:14px;background:var(--s3);display:grid;place-items:center;font-weight:700;font-size:18px;color:var(--a2);flex:none}
.prov .m{flex:1;min-width:0}
.prov b{display:block;font-weight:600;font-size:16px}
.prov small{color:var(--mu);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mu);flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.btn{background:linear-gradient(135deg,var(--a1),#5b8cff);color:#fff;border-radius:14px;padding:13px 18px;font-weight:600;width:100%}
.btn.alt{background:var(--s3);color:var(--tx);border:1px solid var(--ln)}
.btn.sm{width:auto;padding:9px 14px;border-radius:12px;font-size:14px}
.btn:disabled{opacity:.5}
.fld{display:block;margin-bottom:12px}
.fld span{display:block;color:var(--mu);font-size:13px;margin-bottom:5px}
.in{width:100%;background:var(--ink);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;outline:0}
.in:focus{border-color:var(--a1)}
textarea.in{resize:none;min-height:140px;line-height:1.5}
.err{color:var(--bad);font-size:14px;min-height:20px;margin:4px 0 8px}
.mu{color:var(--mu)}
.auth{margin:auto;width:100%;max-width:420px;padding:24px 22px 32px}
.auth .orb{width:68px;height:68px;margin-bottom:18px}
.auth h1{font-size:30px;line-height:1.15;margin:0 0 6px;letter-spacing:-.02em}
.auth p{margin:0 0 22px;color:var(--mu)}
.or{display:flex;align-items:center;gap:10px;color:var(--mu);font-size:13px;margin:16px 0}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--ln)}
.link{color:var(--a2);font-size:14px;text-align:center;display:block;margin-top:14px;width:100%}
/* chat */
.chat{flex:1;overflow-y:auto;padding:6px 14px 10px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:11px 14px;border-radius:20px;word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,#6f63f2,#4f7cff);border-bottom-right-radius:6px}
.msg.assistant{align-self:flex-start;background:var(--s2);border:1px solid var(--ln);border-bottom-left-radius:6px}
.msg.err{border-color:var(--bad);color:#ffd0d7}
.msg pre{background:var(--ink);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;overflow-x:auto;margin:8px 0;white-space:pre;font-size:13px}
.msg code{font-family:ui-monospace,Menlo,monospace;font-size:.9em;background:var(--ink);padding:1px 5px;border-radius:6px}
.msg pre code{background:none;padding:0}
.typing{display:inline-flex;gap:4px}.typing i{width:7px;height:7px;border-radius:50%;background:var(--mu);animation:b 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.3}30%{opacity:1}}
@media (prefers-reduced-motion:reduce){.typing i{animation:none}}
.act{align-self:flex-start;max-width:88%;background:var(--s3);border:1px solid var(--a1);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px;font-size:14px}
.act span{flex:1}
.act.done{border-color:var(--ln);color:var(--mu)}
.mact{display:flex;gap:8px;margin-top:8px}
.composer{display:flex;gap:10px;align-items:flex-end;padding:10px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--ink) 30%)}
.composer textarea{flex:1;max-height:140px;min-height:46px;border-radius:23px;padding:12px 16px;background:var(--s2);border:1px solid var(--ln);outline:0;resize:none;line-height:1.4}
.composer textarea:focus{border-color:var(--a1)}
.send{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--a1),var(--a2));display:grid;place-items:center;flex:none}
.send svg{width:22px;height:22px;stroke:#0c0d14;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.send:disabled{opacity:.45}
.empty{margin:auto;text-align:center;color:var(--mu);padding:30px}
.empty .orb{margin:0 auto 14px;width:60px;height:60px}
/* sheet */
.veil{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;z-index:20}
.sheet{width:100%;max-height:92dvh;overflow-y:auto;background:var(--s2);border-top:1px solid var(--ln);border-radius:26px 26px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 14px;font-size:20px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--ln);background:var(--s3);border-radius:99px;padding:7px 14px;font-size:14px;color:var(--mu)}
.chip.on{border-color:var(--a1);color:var(--tx)}
.row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--ln);width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row .m{flex:1}.row b{display:block;font-weight:600}.row small{color:var(--mu)}
.sw{width:50px;height:30px;border-radius:99px;background:var(--s3);border:1px solid var(--ln);position:relative;flex:none;transition:.15s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--mu);transition:.15s}
.sw.on{background:var(--a1);border-color:var(--a1)}.sw.on:after{left:23px;background:#fff}
.sec{color:var(--mu);font-size:13px;margin:22px 0 6px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--s3);border:1px solid var(--ln);padding:10px 16px;border-radius:99px;z-index:30;font-size:14px}
.tabs{display:flex;gap:8px;padding:0 18px 10px}
.rbar{display:flex;gap:8px;overflow-x:auto;padding:6px 14px 0}.rbar .chip{white-space:nowrap}
.lgw{position:relative;display:inline-grid;place-items:center;border-radius:30%;background:var(--s3);font-weight:700;flex:none;overflow:hidden;vertical-align:middle}
.lgw img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff;padding:2px;box-sizing:border-box}
.lgs{display:flex;flex:none}.lgs .lgw{border:2px solid var(--s2,var(--s3));margin-left:-8px}.lgs .lgw:first-child{margin-left:0}
.who{display:flex;align-items:center;gap:6px}
.mchip{display:inline-flex;align-items:center;border:1px solid var(--ln);background:var(--s3);border-radius:99px;flex:none}
.mchip .chip{border:0;background:none;display:inline-flex;align-items:center;gap:6px;padding:6px 4px 6px 10px}
.mchip .mt{width:34px;height:32px;display:grid;place-items:center;color:var(--mu);background:none;border:0}.mchip .mt svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mchip.off{opacity:.55}.mchip.off .chip{text-decoration:line-through}.mchip.off .mt{color:var(--bad)}
.vp.muted{opacity:.3}.vp.muted small{text-decoration:line-through}
.act{flex-wrap:wrap}
#vask{display:flex;gap:8px;justify-content:center;margin-bottom:10px;flex-wrap:wrap}
.who{font-size:12px;margin:2px 8px -4px;font-weight:600}
.vo{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;padding:calc(18px + env(safe-area-inset-top)) 20px calc(22px + env(safe-area-inset-bottom));background:radial-gradient(700px 520px at 50% 36%,#3a2c9acc,transparent 65%),#080913}
.vtop{font-size:17px}.vst{color:var(--mu);margin-top:6px;min-height:24px}
.vorb{margin:auto 0 0;width:210px;height:210px;border-radius:50%;position:relative;display:grid;place-items:center}
.vcore{width:150px;height:150px;border-radius:50%;background:linear-gradient(135deg,var(--a1),var(--a2));display:grid;place-items:center;box-shadow:0 0 60px #8b7bffaa;position:relative;z-index:1}
.vcore svg{width:46%;height:46%}
.vglow{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,#36d6ff66,transparent 70%)}
.st-listening .vglow{animation:br 2.4s ease-in-out infinite}
.st-speaking .vcore{animation:sp .7s ease-in-out infinite alternate}
.st-thinking .vcore{animation:sp 1.4s ease-in-out infinite alternate;filter:hue-rotate(50deg)}
.st-muted .vcore,.st-idle .vcore{filter:saturate(.4) brightness(.8)}
@keyframes br{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.35);opacity:1}}
@keyframes sp{from{transform:scale(.94)}to{transform:scale(1.08)}}
.vcap{min-height:92px;max-width:340px;text-align:center;font-size:18px;margin:16px 0 8px;overflow:hidden}
.vpeople{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.vp{display:flex;flex-direction:column;align-items:center;gap:4px;opacity:.5;transition:.2s}.vp.on{opacity:1;transform:translateY(-4px)}.vp small{font-size:12px;color:var(--mu)}
.vbtns{display:flex;gap:18px;align-items:center;margin-top:auto}
.ib.big{width:58px;height:58px}.ib.end{background:#ff4d6a;border-color:#ff4d6a}.ib.end svg{stroke:#fff}.ib.big.off{background:var(--bad);border-color:var(--bad)}
@media (prefers-reduced-motion:reduce){.vo *{animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
const $=s=>document.querySelector(s), A=window.Android||null, FENCE='`'.repeat(3);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ICON={
  back:'<svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>',
  plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  gear:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>',
  send:'<svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
  new:'<svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>',
  spark:'<svg viewBox="0 0 24 24"><path d="M12 2c.6 5.4 4.6 9.4 10 10-5.4.6-9.4 4.6-10 10-.6-5.4-4.6-9.4-10-10 5.4-.6 9.4-4.6 10-10z" fill="#fff" stroke="none"/></svg>'
};
const orb=()=>`<div class="orb">${ICON.spark}</div>`;
const PRESETS=[['Gemini','https://gemini.google.com/app'],['ChatGPT','https://chatgpt.com'],['DeepSeek','https://chat.deepseek.com'],['Miniapps','https://miniapps.ai/create'],['Perplexity','https://www.perplexity.ai'],['Copilot','https://copilot.microsoft.com'],['GoogleAI','https://www.google.com/ai']];

let tok=localStorage.tk||'', email=localStorage.em||'', providers=[], busy=false;
const phoneOn=()=>!!A&&localStorage.pc!=='0', askFirst=()=>localStorage.pcask!=='0';

function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}
async function api(path,method,body){
  const r=await fetch(path,{method:method||'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));
  if(r.status===401&&tok&&!path.startsWith('/api/login')){logout(true);throw new Error('Signed out. Please sign in again.')}
  if(!r.ok)throw new Error((j.error&&(j.error.message||j.error))||'Something went wrong ('+r.status+')');
  return j;
}
function setSession(j){tok=localStorage.tk=j.token;email=localStorage.em=j.email;if(j.picture)localStorage.pic=j.picture;location.hash='#/'}
function logout(silent){['tk','em','pic'].forEach(k=>localStorage.removeItem(k));tok='';email='';if(!silent)toast('Signed out');location.hash='#/';route()}

/* ---------- routing ---------- */
window.addEventListener('hashchange',route);
function route(){
  if(!tok)return authView();
  const h=location.hash.replace(/^#\/?/,'');
  if(h.startsWith('chat/'))return chatView(decodeURIComponent(h.slice(5)));
  if(h.startsWith('room/'))return roomView(h.slice(5));
  if(h==='search')return searchView();
  if(h==='compare')return compareView();
  if(h==='settings')return settingsView();
  if(h==='rules')return rulesView();
  return listView();
}

/* ---------- sign in ---------- */
let authMode='login';
function authView(msg){
  $('#app').innerHTML=`<div class="scroll" style="display:flex"><div class="auth">
  ${orb()}<h1>${authMode==='login'?'Welcome back':'Create your account'}</h1>
  <p>One place to talk to every AI you connect to your relay.</p>
  <label class="fld"><span>${authMode==='login'?'Email or username':'Email'}</span><input id="em" class="in" autocomplete="username" autocapitalize="none" inputmode="email"></label>
  ${authMode==='signup'?'<label class="fld"><span>Username (optional)</span><input id="un" class="in" autocapitalize="none"></label>':''}
  <label class="fld"><span>Password</span><input id="pw" class="in" type="password" autocomplete="current-password"></label>
  <div class="err" id="err">${esc(msg||'')}</div>
  <button class="btn" id="go">${authMode==='login'?'Sign in':'Create account'}</button>
  <div class="or">or</div>
  <div id="gwrap"></div>
  <button class="link" id="sw">${authMode==='login'?'New here? Create an account':'Have an account? Sign in'}</button>
  ${authMode==='login'?'<button class="link" id="fg" style="color:var(--mu)">Forgot password?</button>':''}
  </div></div>`;
  $('#go').onclick=doAuth;$('#pw').onkeydown=e=>{if(e.key==='Enter')doAuth()};
  $('#sw').onclick=()=>{authMode=authMode==='login'?'signup':'login';authView()};
  if($('#fg'))$('#fg').onclick=forgot;
  googleButton($('#gwrap'));
}
async function doAuth(){
  const b=$('#go');b.disabled=true;$('#err').textContent='';
  try{
    const body={email:$('#em').value.trim(),password:$('#pw').value};
    if(authMode==='signup')body.username=($('#un')||{}).value||'';
    setSession(await api('/api/'+authMode,'POST',body));route();
  }catch(e){$('#err').textContent=e.message;b.disabled=false}
}
async function forgot(){
  const em=$('#em').value.trim();if(!em){$('#err').textContent='Type your email above first.';return}
  try{await api('/api/forgot','POST',{email:em});toast('If that email has an account, a reset link is on its way')}catch(e){$('#err').textContent=e.message}
}
let gCfg=null;
async function googleButton(box){
  if(A){box.innerHTML='<button class="btn alt" id="gb">Continue with Google</button>';$('#gb').onclick=()=>A.googleSignIn();return}
  try{gCfg=gCfg||await (await fetch('/api/config')).json()}catch{return}
  const init=()=>{
    if(!window.google||!google.accounts)return setTimeout(init,300);
    google.accounts.id.initialize({client_id:gCfg.googleClientId,callback:async r=>{
      try{const j=await api('/api/google','POST',{credential:r.credential});
        if(new URLSearchParams(location.search).has('handoff')){const h=await fetch('/api/handoff',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+j.token}}).then(x=>x.json());handoffDone(h.code);return}
        setSession(j);route()}catch(e){toast(e.message)}}});
    google.accounts.id.renderButton(box,{theme:'filled_black',size:'large',text:'continue_with',shape:'pill',width:300});
  };
  if(!document.getElementById('gis')){const s=document.createElement('script');s.id='gis';s.src='https://accounts.google.com/gsi/client';s.async=true;document.head.appendChild(s)}
  init();
}
/* browser page opened by the Android app for Google sign-in */
function handoffView(){
  $('#app').innerHTML=`<div class="scroll" style="display:flex"><div class="auth">${orb()}<h1>Sign in with Google</h1><p>You'll be sent back to the Relay app when you're done.</p><div id="gwrap"></div><div class="err" id="err"></div></div></div>`;
  googleButton($('#gwrap'));
}
function handoffDone(code){
  const url='relayapp://auth?code='+encodeURIComponent(code);
  $('#app').innerHTML=`<div class="scroll" style="display:flex"><div class="auth">${orb()}<h1>You're signed in</h1><p>Return to the Relay app to continue.</p><a class="btn" style="display:block;text-align:center;text-decoration:none" href="${url}">Open Relay</a></div></div>`;
  location.href=url;
}

/* ---------- providers ---------- */
async function listView(){
  const tab=localStorage.tab==='rooms'?'rooms':'ais';
  $('#app').innerHTML=`<div class="top">${orb()}<h1>Relay</h1><div class="sp"></div><button class="ib" id="sr" aria-label="Search">${ICON.search}</button><button class="ib" id="add" aria-label="Add">${ICON.plus}</button><button class="ib" id="st" aria-label="Settings">${ICON.gear}</button></div><div class="tabs"><button class="chip ${tab==='ais'?'on':''}" id="t1">AIs</button><button class="chip ${tab==='rooms'?'on':''}" id="t2">AI rooms</button><button class="chip" id="t3">Compare</button></div><div class="scroll" id="list"><div class="mu" style="padding:20px 4px">Loading…</div></div>`;
  $('#t1').onclick=()=>{localStorage.tab='ais';listView()};$('#t2').onclick=()=>{localStorage.tab='rooms';listView()};
  $('#st').onclick=()=>location.hash='#/settings';$('#sr').onclick=()=>location.hash='#/search';$('#t3').onclick=()=>location.hash='#/compare';$('#add').onclick=()=>tab==='rooms'?roomSheet():addSheet();
  try{providers=await api('/api/providers')}catch(e){$('#list').innerHTML=`<div class="empty">${esc(e.message)}</div>`;return}
  if(tab==='rooms')return roomsTab();
  if(!providers.length){$('#list').innerHTML=`<div class="empty">${orb()}<b style="color:var(--tx);font-size:18px">No AIs yet</b><p>Add ChatGPT, Gemini, DeepSeek or any chat website, then talk to it from here.</p><button class="btn" id="a2">Add your first AI</button></div>`;$('#a2').onclick=addSheet;return}
  $('#list').innerHTML=providers.map(p=>{let h='';try{h=new URL(p.url).host}catch{}
    const n=lastText(p.name);
    return `<button class="card prov" data-n="${esc(p.name)}"><div class="av">${logo(p.name,34)}</div><div class="m"><b>${esc(p.name)}</b><small>${esc(n||h)}</small></div><span class="dot ${p.hasSession?'on':''}" title="${p.hasSession?'Signed in':'Not signed in'}"></span></button>`}).join('')
   +`<p class="mu" style="font-size:13px;text-align:center;margin-top:18px">Green dot: signed in to that site. Open Settings → Sign in to a site if a dot is grey.</p>`;
  document.querySelectorAll('.prov').forEach(b=>b.onclick=()=>location.hash='#/chat/'+encodeURIComponent(b.dataset.n));
}

      if(c==='"')str=true;else if(c==='{')d++;else if(c==='}'){d--;if(d===0){end=j;break}}}
    if(end<0)break;
    try{const o=JSON.parse(t.slice(m.index,end+1));if(o&&o.action){
      acts.push(o);
      let pre=t.slice(i,m.index).replace(/(?:^|\n)[ \t]*(?:ACTION:|phone|json|`{3}[a-z]*)\s*$/i,'').replace(/`{3}\s*$/,'');

/* talking to one AI of the room (its own chat per room, never mixed with its solo chat) */
async function streamPlayground(body,onDelta,signal){
  const r=await fetch('/api/playground',{signal,method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok},body:JSON.stringify(body)});
  if(r.status===401){logout(true);throw new Error('Signed out')}
  if(!(r.headers.get('content-type')||'').includes('event-stream')){const j=await r.json().catch(()=>({}));throw new Error((j.error&&(j.error.message||j.error))||'Error '+r.status)}
  const rd=r.body.getReader(),dec=new TextDecoder();let buf='',all='';
  for(;;){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;
    while((i=buf.indexOf('\n\n'))>=0){const ev=buf.slice(0,i).trim();buf=buf.slice(i+2);if(!ev.startsWith('data:'))continue;const d=ev.slice(5).trim();if(d==='[DONE]')continue;
      let j;try{j=JSON.parse(d)}catch{continue}
      if(j.error)throw new Error(j.error.message||'The AI could not answer');
      const t=j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content;if(t){all+=t;onDelta&&onDelta(all)}}}
  return all;
}
function roomSys(room,name){
  const others=activeNames(room).filter(m=>m!==name).map(cap).join(', ');
  const rules=[(localStorage['rr:all']||'').trim(),(localStorage['rr:'+name]||'').trim(),room.topic].filter(Boolean).join('\n');
  return 'You are '+cap(name)+', taking part in a live group meeting. Present: the User (a person) and these AIs: '+others+'. Every message you receive is labelled with its speaker, like "[User]: ..." or "[Gemini]: ...". Rules: (1) Reply only as '+cap(name)+', in your own voice. Never write lines for anyone else and never start with a label. (2) Keep it short: one to three sentences, unless the User asks for detail. (3) Talk with the others by name: build on, question or politely disagree with what they said, and do not repeat points already made. (4) Answer the User directly when they speak to you or to everyone. (5) If you have nothing useful to add, reply with exactly PASS. (6) Plain spoken sentences only: no markdown, lists, emojis or links, because your words may be read aloud. (7) You can tag another AI with @name when you want to ask them something. You may NOT start a back-and-forth with the other AIs on your own: if you want to talk with them while the User is quiet, finish your reply with one last line in exactly this form: ASK_USER: @name short reason. The User has to approve it first. Use this only when it is really worthwhile.'+(rules?'\nNotes and rules from the User for this meeting:\n'+rules:'');
}
function historyFor(room,name){
  const h=[];
  for(const m of room.msgs){
    if(m.who==='system')continue;
    if(m.who===name)h.push({role:'assistant',content:m.pass?'PASS':(m.content+(m.ask?'\nASK_USER: '+m.ask.reason:'')).trim()});
    else if(!m.pass)h.push({role:'user',content:'['+(m.who==='user'?'User':cap(m.who))+']: '+m.content});
  }
  return h.slice(-40);
}
function cleanReply(t,name,room){
  t=String(t||'').replace(new RegExp('^\\s*\\[?\\*{0,2}'+name+'\\*{0,2}\\]?\\s*:\\s*','i'),'');
  const others=room.members.filter(m=>m!==name).concat(['user']);
  const k=t.search(new RegExp('\\n\\s*\\[?\\*{0,2}(?:'+others.join('|')+')\\*{0,2}\\]?\\s*:','i'));
  if(k>0)t=t.slice(0,k);
  return t.replace(/\*\*|__|`/g,'').trim();
}
/* one generation at a time across the whole room: this is what stops the AIs colliding */
function generate(R,name,noAsk){const job=R.lock.then(()=>doGen(R,name,noAsk));R.lock=job.catch(()=>{});return job}
async function doGen(R,name,noAsk){
  const room=getRoom(R.id),hist=historyFor(room,name);
  if(isMuted(room,name))return {skip:true};
  if(!hist.length||hist[hist.length-1].role!=='user')return {skip:true};
  R.typing=name;refresh(R);R.ctl=new AbortController();
  try{
    const text=await streamPlayground({model:name,room:room.id,messages:[{role:'system',content:roomSys(room,name)}].concat(hist),stream:true},null,R.ctl.signal);
    R.typing=null;
    if(isMuted(getRoom(R.id),name))return {skip:true};
    let t=cleanReply(text,name,room),ask=null;
    const mm=t.match(/(?:^|\n)[ \t]*ASK_USER[ \t]*:[ \t]*([^\n]+?)[ \t]*$/i);
    if(mm){t=t.slice(0,mm.index).trim();ask=mm[1].trim()}
    if(ask&&(noAsk||getRoom(R.id).msgs.some(m=>m.ask&&m.ask.status==='pending')))ask=null;
    if(!t&&!ask)return {err:'No reply came back. Check that this AI is still signed in.'};
    if(!ask&&/^PASS\b/i.test(t))return {pass:true};

  }catch(e){R.typing=null;if(e&&e.name==='AbortError')return {skip:true};return {err:e.message}}
}
async function speakAs(R,n,text){
  const room=getRoom(R.id);R.speaking=n;if(R.vm)R.vm.caption=cap(n)+': '+text;refresh(R);
  await Voice.speak(text,voiceOf(room,n));
  if(R.speaking===n)R.speaking=null;refresh(R);
}
function mkAsk(room,n,reason){
  const low=reason.toLowerCase(),to=room.members.filter(m=>m!==n&&new RegExp('(^|[^a-z0-9])@?'+m.replace(/[^a-z0-9]/gi,'.')+'([^a-z0-9]|$)').test(low));
  return {reason:reason.replace(/@/g,''),to,status:'pending'}}
function pushMsg(R,room,n,res){
  const m={who:n,content:res.text||''};if(res.ask)m.ask=mkAsk(room,n,res.ask);notifyDone(room.name+' · '+cap(n),(res.text||'')+(res.ask?' (wants to talk with the others)':''));
  room.msgs.push(m);saveRoom(room);refresh(R);return m}
const askLine=(room,m)=>m.ask?' '+cap(m.who)+' would like to talk with '+(m.ask.to.length?m.ask.to.map(cap).join(' and '):'the others')+' on their own. Say yes or no.':''
/* one round of replies to what the user just said */
async function runTurns(R,my,order,opts){
  R.active++;
  try{
    const room=getRoom(R.id);let chain=Promise.resolve();
    for(const n of order){
      if(R.run!==my)break;
      const res=await generate(R,n,false);
      if(R.run!==my)break;
      if(res.skip||res.pass)continue;
      if(res.err){room.msgs.push({who:'system',content:cap(n)+': '+res.err});saveRoom(room);refresh(R);continue}
      const m=pushMsg(R,room,n,res);
      if(opts.speak)chain=chain.then(()=>R.run===my?speakAs(R,n,(res.text+askLine(room,m)).trim()):null);
    }
    await chain;
  }finally{R.active--;R.typing=null;R.speaking=null;refresh(R)}
}
/* AIs talking among themselves: only ever started by the user (button, or approving an AI's request) */
async function chatLoop(R,my,first,opts,max){
  R.active++;
  try{
    const room=getRoom(R.id);let chain=Promise.resolve(),next=first.slice(),last=null,idle=0,count=0;
    while(count<max&&R.run===my){
      const act=activeNames(room);if(act.length<2)break;
      while(next.length&&(!act.includes(next[0])||next[0]===last))next.shift();
      let n=next.shift();
      if(!n){const i=act.indexOf(last);n=act[(i+1)%act.length]}
      const res=await generate(R,n,true);
      if(R.run!==my)break;
      count++;
      if(res.skip){if(++idle>=act.length)break;last=n;continue}
      if(res.err){room.msgs.push({who:'system',content:cap(n)+': '+res.err});saveRoom(room);refresh(R);break}
      if(res.pass){last=n;if(++idle>=act.length)break;continue}
      idle=0;last=n;pushMsg(R,room,n,res);
      const tagged=[...res.text.toLowerCase().matchAll(/@([a-z0-9-]+)/g)].map(x=>x[1]).filter(x=>act.includes(x)&&x!==n);
      if(tagged.length)next=tagged.concat(next);
      if(opts.speak)chain=chain.then(()=>R.run===my?speakAs(R,n,res.text):null);
    }
    await chain;
  }finally{R.active--;R.typing=null;R.speaking=null;refresh(R)}
}
const rotated=room=>{const a=activeNames(room),k=(room.off||0)%Math.max(1,a.length);room.off=(room.off||0)+1;return a.slice(k).concat(a.slice(0,k))};
const pendingAsk=room=>[...room.msgs].reverse().find(m=>m.ask&&m.ask.status==='pending');
function answerAsk(R,m,allow,opts){
  const room=getRoom(R.id);opts=opts||{};if(!m||!m.ask||m.ask.status!=='pending')return;
  m.ask.status=allow?'allowed':'denied';
  if(!allow){room.msgs.push({who:'user',content:'Not now, please do not start that conversation.'});saveRoom(room);refresh(R);return}
  const my=begin(R);
  room.msgs.push({who:'user',content:'Yes, you may talk with each other about that now. I will listen.'});saveRoom(room);refresh(R);
  const act=activeNames(room);let first=m.ask.to.filter(x=>act.includes(x));if(!first.length)first=act.filter(x=>x!==m.who);

async function converse(R,text,opts){
  const room=getRoom(R.id);opts=opts||{};
  const pm=pendingAsk(room);
  if(pm){
    if(/^\s*(yes|yeah|yep|yup|ok|okay|sure|go ahead|go on|allow|please do|do it)\b/i.test(text))return answerAsk(R,pm,true,opts);
    if(/^\s*(no|nope|nah|not now|don'?t|stop)\b/i.test(text))return answerAsk(R,pm,false,opts);
    pm.ask.status='skipped';
  }
  const asked=[...text.toLowerCase().matchAll(/@([a-z0-9-]+)/g)].map(x=>x[1]);
  const act=activeNames(room);
  if(!act.length){toast('Everyone is muted. Tap a speaker icon to let an AI talk.');return}
  const named=act.filter(n=>asked.includes(n));
  if(asked.length&&!named.length&&!asked.includes('all')&&!asked.includes('everyone')&&room.members.some(n=>asked.includes(n))){toast('That AI is muted. Tap its speaker icon to unmute.');return}
  const my=begin(R);
  room.msgs.push({who:'user',content:text});saveRoom(room);refresh(R);

  const vm=R.vm,st=R.speaking?'speaking':(R.typing||R.active>0)?'thinking':vm.muted?'muted':vm.idle?'idle':vm.listening?'listening':'idle';
  d.className='vo st-'+st;
  const names={speaking:cap(R.speaking||'')+' is speaking. Tap to interrupt.',thinking:R.typing?cap(R.typing)+' is thinking…':'They are talking…',muted:'Muted',idle:'Tap the orb and speak',listening:'Listening…'};
  $('#vst').textContent=names[st];$('#vcap').textContent=vm.caption||'';
  d.querySelectorAll('.vp').forEach(p=>{p.classList.toggle('on',p.dataset.n===(R.speaking||R.typing));p.classList.toggle('muted',isMuted(getRoom(R.id),p.dataset.n))});
  const pm=pendingAsk(getRoom(R.id)),va=$('#vask');
  if(va){const key=pm?'1':'';if(va.dataset.k!==key){va.dataset.k=key;va.innerHTML=pm?`<button class="btn sm" id="vyes">Allow ${esc(cap(pm.who))} to chat</button><button class="btn sm alt" id="vno">Not now</button>`:'';
    if(pm){$('#vyes').onclick=()=>answerAsk(R,pm,true,{speak:true});$('#vno').onclick=()=>answerAsk(R,pm,false,{speak:true})}}}
  $('#vmute').innerHTML=vm.muted?ICON.micoff:ICON.mic;$('#vmute').classList.toggle('off',vm.muted);
}
async function voiceLoop(R){
  const vm=R.vm;
  while(vm.on){
    if(vm.muted||R.active>0){vm.listening=false;vmDraw(R);await sleep(250);continue}
    vm.listening=true;vm.caption='';vmDraw(R);
    let text='';
    try{text=await Voice.listen(p=>{vm.caption='You: '+p;vmDraw(R)})}
    catch(e){
      vm.listening=false;if(!vm.on)break;const c=String(e);
      if(c==='stop'||c==='aborted')continue;
      if(c==='perm'||c==='9'){toast('Allow the microphone to talk to the room');vmClose(R);return}
      if(['6','7','no-speech','end'].includes(c)){if(++vm.miss>=3){vm.miss=0;vm.idle=true;vmDraw(R);await new Promise(r=>vm.tap=r);vm.idle=false}continue}
      await sleep(800);if(++vm.err>=4){toast('Voice input stopped. Check your internet and the Google app.');vmClose(R);return}continue}
    vm.listening=false;vm.miss=0;vm.err=0;
    if(!text.trim())continue;
    vm.caption='You: '+text;vmDraw(R);
    await converse(R,text,{speak:true});
  }
}

/* ---------- extras: search, compare, export, update check ---------- */
Object.assign(ICON,{
  search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',
  share:'<svg viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M5 13v6a2 2 0 002 2h10a2 2 0 002-2v-6"/></svg>',
  speaker:'<svg viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4zM15.5 8.5a5 5 0 010 7M18.5 5.5a9 9 0 010 13"/></svg>',
  speakeroff:'<svg viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4zM22 9l-6 6M16 9l6 6"/></svg>'
});
const authLike=t=>/sign.?in|log.?in|logged|session|captcha|expired|verify|unauthor|not authenticated|text box|login wall/i.test(t||'');
function exportText(title,text){
  if(A){try{A.phone(JSON.stringify({action:'share',text:title+'\n\n'+text}))}catch{}return}
  if(navigator.share){navigator.share({title,text}).catch(()=>{});return}
  try{navigator.clipboard.writeText(text);toast('Copied to clipboard')}catch{toast('Could not export')}
}
function searchView(){
  $('#app').innerHTML=`<div class="top"><button class="ib" id="bk" aria-label="Back">${ICON.back}</button><h1>Search chats</h1></div><div class="scroll"><input id="q" class="in" placeholder="Search all your chats and rooms" autocomplete="off"><div id="res" style="margin-top:14px"></div></div>`;
  $('#bk').onclick=()=>location.hash='#/';
  const run=()=>{
    const q=$('#q').value.trim().toLowerCase();if(q.length<2){$('#res').innerHTML='';return}
    const out=[];
    for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);
      try{
        if(k.startsWith('m:')){JSON.parse(localStorage[k]).forEach(m=>{if(m.content&&m.content.toLowerCase().includes(q))out.push({t:'chat',n:k.slice(2),c:m.content})})}
        else if(k.startsWith('room:')){const r=JSON.parse(localStorage[k]);(r.msgs||[]).forEach(m=>{if(!m.pass&&m.content&&m.content.toLowerCase().includes(q))out.push({t:'room',n:r.name,id:r.id,c:m.content})})}
      }catch{}}
    $('#res').innerHTML=out.slice(0,40).map(o=>{const i=o.c.toLowerCase().indexOf(q),sn=o.c.slice(Math.max(0,i-40),i+100).replace(/\s+/g,' ');
      return `<button class="card prov" data-t="${o.t}" data-n="${esc(o.n)}" data-id="${esc(o.id||'')}"><div class="m"><b>${esc(o.t==='room'?o.n+' (room)':cap(o.n))}</b><small style="white-space:normal">${esc(sn)}</small></div></button>`}).join('')||'<div class="mu">No matches.</div>';
    document.querySelectorAll('#res .prov').forEach(b=>b.onclick=()=>location.hash=b.dataset.t==='room'?'#/room/'+b.dataset.id:'#/chat/'+encodeURIComponent(b.dataset.n));
  };
  $('#q').oninput=run;
}
let cmpBusy=false;
async function compareView(){
  try{if(!providers.length)providers=await api('/api/providers')}catch{}
  const sel=new Set(providers.map(p=>p.name));
  $('#app').innerHTML=`<div class="top"><button class="ib" id="bk" aria-label="Back">${ICON.back}</button><h1>Compare AIs</h1></div><div class="scroll"><p class="mu" style="margin:0 0 10px">Ask one question and read every AI's answer, one after another.</p><div class="chips" id="cc">${providers.map(p=>`<button class="chip on" data-n="${esc(p.name)}">${esc(cap(p.name))}</button>`).join('')}</div><textarea id="cq" class="in" style="min-height:110px" placeholder="Your question…"></textarea><button class="btn" id="cg" style="margin-top:12px">Ask them all</button><div id="cres" style="margin-top:16px"></div></div>`;
  $('#bk').onclick=()=>location.hash='#/';
  document.querySelectorAll('#cc .chip').forEach(c=>c.onclick=()=>{const n=c.dataset.n;if(sel.has(n)){sel.delete(n);c.classList.remove('on')}else{sel.add(n);c.classList.add('on')}});
  $('#cg').onclick=async()=>{
    if(cmpBusy)return;const q=$('#cq').value.trim(),names=providers.map(p=>p.name).filter(n=>sel.has(n));
    if(!q||!names.length){toast('Type a question and pick at least one AI');return}
    cmpBusy=true;$('#cg').disabled=true;
    $('#cres').innerHTML=names.map((n,i)=>`<div class="card" style="margin-bottom:10px"><b style="color:var(--a2)">${esc(cap(n))}</b><div class="cb mu" id="cb${i}" style="margin-top:6px;white-space:pre-wrap">Waiting…</div></div>`).join('');
    for(let i=0;i<names.length;i++){
      const el=document.getElementById('cb'+i);if(!el)break;el.textContent='Thinking…';
      try{
        const t=await streamPlayground({model:names[i],room:'cmp',messages:[{role:'system',content:'Answer each question on its own and ignore earlier questions in this chat. Be clear and reasonably brief.'},{role:'user',content:q}],stream:true},a=>{el.className='cb';el.textContent=a});
        if(!t.trim())el.textContent='No reply came back.';
      }catch(e){el.className='cb mu';el.textContent=e.message+(authLike(e.message)?' (you may need to sign in to this AI again from Settings)':'')}
    }
    cmpBusy=false;const g=$('#cg');if(g)g.disabled=false;
  };
}
async function checkUpdate(){
  if(!A||!A.version)return null;
  try{
    const j=await (await fetch('https://api.github.com/repos/Doreenats232/relayapi/releases/tags/app-latest')).json();
    const m=/build (\d+)/.exec(j.body||''),latest=m?+m[1]:0,cur=+A.version(),a=(j.assets||[]).find(x=>x.name==='RelayApp.apk');
    return latest>cur&&a?{latest,url:a.browser_download_url}:false;
  }catch{return null}
}

/* ---------- start ---------- */
(async function start(){
  const q=new URLSearchParams(location.search);
  if(q.has('handoff')&&!A){return handoffView()}
  if(q.get('code')){
    try{const j=await (await fetch('/api/handoff/redeem',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:q.get('code')})})).json();
      if(j.token){tok=localStorage.tk=j.token;email=localStorage.em=j.email||'';if(j.picture)localStorage.pic=j.picture}else toast(j.error||'Sign-in failed')}catch{toast('Sign-in failed')}
    history.replaceState(null,'','/app/#/');
  }
  route();
  if(A&&A.version&&Date.now()-(+localStorage.updchk||0)>864e5){localStorage.updchk=Date.now();checkUpdate().then(u=>{if(u)toast('A new app version is ready. See Settings.')})}
})();
